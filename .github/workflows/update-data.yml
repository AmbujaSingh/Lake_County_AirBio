name: Update Lake County AirBio data

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch live weather, AQI, and modeled pollen/mold data
        run: python scripts/fetch_data.py --out data.json

      - name: Commit updated data.json (if it changed)
        run: |
          git config user.name "airbio-data-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data.json; then
            echo "No data changes — skipping commit."
          else
            git add data.json
            git commit -m "Update data.json ($(date -u +'%Y-%m-%d %H:%M UTC'))"
            git push
          fi
